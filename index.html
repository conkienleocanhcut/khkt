<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đo Tần Số Va Chạm Nông Sản (Bản Nhạy Bậc Cao)</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 24px; }
        button { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; margin: 20px 0; width: 100%; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { font-size: 18px; color: #ff5722; font-weight: bold; margin-bottom: 5px; height: 25px; }
        #live-vol { font-size: 14px; color: #0056b3; font-weight: bold; margin-bottom: 15px; }
        #result-box { background: #222; color: #00ff00; padding: 20px; border-radius: 5px; margin-top: 10px; }
        #final-freq { font-size: 48px; font-weight: bold; margin: 10px 0; }
        #log { text-align: left; font-size: 14px; color: #666; margin-top: 15px; max-height: 150px; overflow-y: auto; background: #eee; padding: 10px; border-radius: 5px;}
    </style>
</head>
<body>

<div class="container">
    <h1>Máy Đo Tần Số Va Chạm</h1>
    <p>Bộ lọc: > 1000Hz | Chế độ: Âm thanh mộc (Raw)</p>
    
    <button id="start-btn">BẮT ĐẦU ĐO (10 s)</button>
    
    <div id="status">Sẵn sàng</div>
    <!-- CÔNG CỤ DEBUG: Hiển thị âm lượng thời gian thực -->
    <div id="live-vol">Âm lượng đo được: 0 (Ngưỡng đếm: 80)</div>
    
    <div id="result-box">
        <div>Tần số đỉnh trung bình:</div>
        <div id="final-freq">0 Hz</div>
        <div id="count">Số hạt phát hiện: 0</div>
    </div>

    <div id="log">Nhật ký va chạm sẽ hiện ở đây...</div>
</div>

<script>
    let audioContext;
    let analyser;
    let microphone;
    let isRecording = false;
    let peaks = [];
    let inCooldown = false;
    let animationId;

    // THÔNG SỐ ĐÃ ĐƯỢC ĐIỀU CHỈNH LẠI
    const RECORD_TIME = 10000; 
    const AMPLITUDE_THRESHOLD = 80; // Hạ từ 150 xuống 80 để cực nhạy
    const COOLDOWN_TIME = 100; 
    const MIN_FREQ = 1000; // Hạ xuống 1000Hz theo yêu cầu

    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status');
    const liveVolText = document.getElementById('live-vol');
    const finalFreqText = document.getElementById('final-freq');
    const countText = document.getElementById('count');
    const logBox = document.getElementById('log');

    async function setupAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Yêu cầu thu âm MỘC (tắt lọc ồn của điện thoại)
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: false,
                    autoGainControl: false,
                    noiseSuppression: false
                }, 
                video: false 
            });
            
            microphone = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 8192; 
            microphone.connect(analyser);
        }
        if (audioContext.state === 'suspended') {
            await audioContext.resume();
        }
    }

    function analyzeSound() {
        if (!isRecording) return;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        let maxVolume = 0;
        let maxIndex = -1;
        const nyquist = audioContext.sampleRate / 2;
        
        // Quét từ 1000Hz trở lên
        const startIndex = Math.floor((MIN_FREQ / nyquist) * bufferLength);

        for (let i = startIndex; i < bufferLength; i++) {
            if (dataArray[i] > maxVolume) {
                maxVolume = dataArray[i];
                maxIndex = i;
            }
        }

        const currentFreq = (maxIndex / bufferLength) * nyquist;

        // Cập nhật âm lượng lên màn hình để chẩn đoán lỗi
        liveVolText.innerText = `Âm lượng đo được: ${maxVolume} / 255`;

        // Bắt đầu lọc điều kiện
        if (maxVolume > AMPLITUDE_THRESHOLD && !inCooldown) {
            peaks.push(currentFreq);
            
            countText.innerText = `Số hạt phát hiện: ${peaks.length}`;
            logBox.innerHTML = `Phát hiện: ${Math.round(currentFreq)} Hz (Âm lượng: ${maxVolume}) <br>` + logBox.innerHTML;
            
            inCooldown = true;
            setTimeout(() => { inCooldown = false; }, COOLDOWN_TIME);
        }

        animationId = requestAnimationFrame(analyzeSound);
    }

    startBtn.addEventListener('click', async () => {
        try {
            await setupAudio();
        } catch (err) {
            alert("Lỗi truy cập Micro: " + err.name + " - " + err.message);
            return;
        }

        // Reset trạng thái
        peaks = [];
        isRecording = true;
        inCooldown = false;
        startBtn.disabled = true;
        statusText.innerText = "ĐANG THU ÂM... (Gõ thử tua vít!)";
        statusText.style.color = "red";
        finalFreqText.innerText = "...";
        countText.innerText = "Số hạt phát hiện: 0";
        logBox.innerHTML = "";

        // Bắt đầu quét
        analyzeSound();

        // Đếm ngược 5 giây
        setTimeout(() => {
            isRecording = false;
            cancelAnimationFrame(animationId);
            startBtn.disabled = false;
            statusText.innerText = "HOÀN THÀNH";
            statusText.style.color = "green";
            liveVolText.innerText = "Đã dừng quét âm thanh.";

            if (peaks.length > 0) {
                let sum = peaks.reduce((a, b) => a + b, 0);
                let averageFreq = sum / peaks.length;
                finalFreqText.innerText = Math.round(averageFreq) + " Hz";
                logBox.innerHTML = `<b>Xong! Trung bình: ${Math.round(averageFreq)} Hz</b><br>` + logBox.innerHTML;
            } else {
                finalFreqText.innerText = "0 Hz";
                logBox.innerHTML = "Không phát hiện tiếng va chạm nào lọt qua bộ lọc.";
            }
        }, RECORD_TIME);
    });
</script>

</body>
</html>
